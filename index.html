<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07182f" />
    <title>Panel Treno</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="icon" href="icon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon/icon.svg" />
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="title-row">
          <h1 id="stationTitle" class="station-name"></h1>
          <span class="clock" id="currentTime" aria-label="Current time"></span>
        </div>

        <div id="searchLegendContainer" class="toolbar">
          <a href="search.html" class="icon-btn" id="text-search"><i class="bi bi-search"></i></a>

          <select id="groupBySelect" aria-label="Group by"></select>

          <div class="filter-wrap" id="filterWrap">
            <button type="button" class="icon-btn" id="filterToggle">
              <i class="bi bi-funnel"></i>
            </button>
            <input type="text" id="groupFilterInput" autocomplete="off" />
            <button type="button" class="filter-clear" id="filterClear" aria-label="Clear filter" hidden>
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <button type="button" class="pill-btn" id="viewToggle">
            <i class="bi bi-terminal"></i><span id="viewToggleLabel"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="app-header-spacer" id="headerSpacer"></div>

    <main id="trainInfo" class="board"></main>

    <footer class="app-footer">
      <span class="footer-item"><span class="live-dot" id="liveDot"></span><span id="updateDate"></span></span>
      <a href="http://www.viaggiatreno.it" target="_blank" rel="noopener">ViaggiaTreno (RFI)</a>
      <span class="footer-item">v<span id="versionNumber"></span></span>
    </footer>

    <script src="js/modules/proxy.js"></script>
    <script src="js/main-app.js"></script>
  </body>
</html>
