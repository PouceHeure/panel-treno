<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07182f" />
    <title>Panel Treno</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="icon" href="icon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon/icon.svg" />
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Panel Treno" />
    <link rel="stylesheet" href="css/style.css?v=68e5b4d2" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="title-row">
          <h1 id="stationTitle" class="station-name"></h1>
          <span class="clock" id="currentTime" aria-label="Current time"></span>
        </div>

        <div id="searchLegendContainer" class="toolbar">
          <a href="home.html" class="pill-btn" id="text-search"><i class="bi bi-house"></i><span id="homeLabel">Home</span></a>
          <button type="button" class="icon-btn" id="stationStar" aria-pressed="false" hidden><i class="bi bi-star"></i></button>

          <select id="groupBySelect" aria-label="Group by"></select>

          <div class="filter-wrap" id="filterWrap">
            <button type="button" class="icon-btn" id="filterToggle">
              <i class="bi bi-funnel"></i>
            </button>
            <input type="text" id="groupFilterInput" autocomplete="off" />
            <button type="button" class="filter-clear" id="filterClear" aria-label="Clear filter" hidden>
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <nav class="source-switch" id="sourceSwitch" aria-label="Data source" hidden>
            <a data-source="vt" title="ViaggiaTreno only">Viaggia</a>
            <a data-source="rfi" title="Official RFI station board">RFI</a>
            <a data-source="global" title="Both sources together: merged board, delays as an interval">Global</a>
          </nav>
          <a class="pill-btn" id="trainBack" href="index.html" hidden>
            <i class="bi bi-arrow-left"></i><span id="trainBackLabel">Board</span>
          </a>
          <button type="button" class="pill-btn" id="trackToggle" hidden>
            <i class="bi bi-broadcast"></i><span id="trackToggleLabel">Tracking</span>
          </button>
          <button type="button" class="pill-btn" id="trainPin" hidden>
            <i class="bi bi-pin-angle"></i><span id="trainPinLabel">Follow</span>
          </button>
          <button type="button" class="pill-btn" id="trainShare" hidden>
            <i class="bi bi-share"></i><span id="trainShareLabel">Share</span>
          </button>

          <button type="button" class="pill-btn" id="viewToggle">
            <i class="bi bi-terminal"></i><span id="viewToggleLabel"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="app-header-spacer" id="headerSpacer"></div>

    <main id="trainInfo" class="board"></main>

    <footer class="app-footer">
      <span class="footer-status" id="footerStatus">
        <span class="live-dot is-pending" id="liveDot"></span>
        <span class="status-text">
          <span><strong id="statusLabel"></strong><span id="updateDate"></span></span>
          <span class="status-detail" id="statusDetail"></span>
          <span class="req-strip" id="requestStrip" aria-label="Last requests"></span>
        </span>
      </span>
      <a href="http://www.viaggiatreno.it" target="_blank" rel="noopener">ViaggiaTreno (RFI)</a>
      <span class="times-switch" id="timesSwitch" role="group" aria-label="Predicted times" title="raw: scheduled time plus the announced delay. rules: corrected for the delay trains recover. tables: rules plus the usual error of each stretch.">
        <span class="times-label">times</span>
        <button type="button" data-mode="raw">raw</button>
        <button type="button" data-mode="model">rules</button>
        <button type="button" data-mode="tables">tables</button>
      </span>
      <span class="footer-item">v<span id="versionNumber"></span></span>
    </footer>

    <script src="js/modules/format.js?v=e065bb89"></script>
    <script src="js/modules/proxy.js?v=1a0ebef6"></script>
    <script src="js/modules/model.js?v=8b448878"></script>
    <script src="js/modules/prediction-log.js?v=ec1602e4"></script>
    <script src="js/modules/recent.js?v=7927125c"></script>
    <script src="js/modules/station-topology.js?v=692079e6"></script>
    <script src="js/modules/station-map.js?v=09511503"></script>
    <script src="js/modules/follow.js?v=9dd8cef4"></script>
    <script src="js/modules/rfi-source.js?v=f8978329"></script>
    <script src="js/main-app.js?v=24a11ced"></script>
  </body>
</html>
