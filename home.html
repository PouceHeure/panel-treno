<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF1F5" />
    <title>Panel Treno</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="icon" href="icon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon/icon.svg" />
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Panel Treno" />
    <link rel="stylesheet" href="css/style.css?v=13d40eb7" />

    <script src="js/modules/format.js?v=e065bb89" defer></script>
    <script src="js/modules/proxy.js?v=1a0ebef6" defer></script>
    <script src="js/modules/recent.js?v=7927125c" defer></script>
    <script src="js/modules/follow.js?v=9dd8cef4" defer></script>
    <script src="js/modules/station-index.js?v=cb654a49" defer></script>
    <script src="js/modules/model.js?v=6794ae53" defer></script>
    <script src="js/modules/prediction-log.js?v=ec1602e4" defer></script>
    <script src="js/modules/search.js?v=d75c3830" defer></script>
  </head>
  <body class="search-page">
    <main class="search-main">
      <h1 class="search-title"><i class="bi bi-train-front"></i> <span id="title"></span></h1>
      <p class="search-sub" id="subtitle"></p>

      <div class="search-tabs" role="tablist">
        <button type="button" role="tab" id="tabStation" class="search-tab is-active" aria-selected="true">
          <i class="bi bi-geo-alt"></i> Stations
        </button>
        <button type="button" role="tab" id="tabTrain" class="search-tab" aria-selected="false">
          <i class="bi bi-train-front"></i> Trains
        </button>
      </div>

      <form id="searchForm" class="search-form">
        <input type="text" id="searchInput" autocomplete="off" autofocus required />
        <button id="btn-search" type="submit"></button>
      </form>

      <div id="results"></div>
      <div class="home-grid" id="homeGrid">
        <section id="preview" class="preview" hidden></section>
        <div class="home-side">
          <section id="following" class="recent" hidden></section>
          <section id="favorites" class="recent" hidden></section>
          <section id="major" class="recent"></section>
          <section id="recent" class="recent" hidden></section>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <span>Real-time departures, Italian railways</span>
      <a href="lab.html"><i class="bi bi-bar-chart-line"></i> Lab</a>
      <a href="http://www.viaggiatreno.it" target="_blank" rel="noopener">ViaggiaTreno (RFI)</a>
    </footer>
  </body>
</html>
