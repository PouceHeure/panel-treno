<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f72ff"/>
      <stop offset="1" stop-color="#6a35e8"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- train front -->
  <path fill="#fff" d="M150 118h104c36 0 62 26 62 62v206a28 28 0 0 1-28 28H116a28 28 0 0 1-28-28V180c0-36 26-62 62-62z" transform="translate(4 0)"/>
  <!-- destination sign -->
  <rect x="136" y="146" width="112" height="26" rx="13" fill="url(#bg)"/>
  <!-- windshield (two panes) -->
  <rect x="124" y="196" width="68" height="84" rx="10" fill="url(#bg)"/>
  <rect x="204" y="196" width="68" height="84" rx="10" fill="url(#bg)"/>
  <!-- headlights -->
  <circle cx="156" cy="344" r="24" fill="url(#bg)"/>
  <circle cx="240" cy="344" r="24" fill="url(#bg)"/>
  <!-- pantograph on the roof -->
  <path d="M146 118l24-34 24 34M170 84h-34M170 84h34" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wheels / rails -->
  <rect x="112" y="400" width="52" height="28" rx="10" fill="#fff"/>
  <rect x="232" y="400" width="52" height="28" rx="10" fill="#fff"/>
  <rect x="92" y="440" width="236" height="12" rx="6" fill="#fff"/>

  <!-- clock badge, cut out of the train with a ring in the background color -->
  <circle cx="338" cy="172" r="104" fill="url(#bg)"/>
  <circle cx="338" cy="172" r="86" fill="none" stroke="#fff" stroke-width="16"/>
  <path d="M338 120v56l36 22" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
