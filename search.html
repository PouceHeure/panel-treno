<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07182f" />
    <title>Search Station - Panel Treno</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="icon" href="icon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon/icon.svg" />
    <link rel="apple-touch-icon" href="icon/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/modules/proxy.js" defer></script>
    <script src="js/modules/search.js" defer></script>
  </head>
  <body class="search-page">
    <main class="search-main">
      <h1 class="search-title"><i class="bi bi-search"></i> <span id="title"></span></h1>

      <form id="searchForm" class="search-form">
        <input
          type="text"
          id="searchInput"
          placeholder="e.g. Milano Centrale"
          autocomplete="off"
          autofocus
          required
        />
        <button id="btn-search" type="submit"></button>
      </form>

      <div id="results"></div>
    </main>

    <footer class="app-footer">
      <a href="index.html"><i class="bi bi-arrow-left"></i> Back</a>
      <a href="http://www.viaggiatreno.it" target="_blank" rel="noopener">ViaggiaTreno (RFI)</a>
    </footer>
  </body>
</html>
